apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollback-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rollback-lab
  template:
    metadata:
      labels:
        app: rollback-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: capstone-rollback-vote:reviewed
          imagePullPolicy: Never
          command:
            - python
            - -u
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      status = 200 if self.path == "/health" else 404
                      self.send_response(status)
                      self.end_headers()
                      self.wfile.write(b"OK" if status == 200 else b"Not Found")

              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: {{ .Values.readyPath | quote }}
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2


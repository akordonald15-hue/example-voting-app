# Rebase against the instructor's supplied values before deployment.
# Official kube-prometheus-stack chart, release monitoring, namespace observability.
# Pin chart/dependencies and review CRDs/RBAC before any approved installation.
fullnameOverride: monitoring
defaultRules: {create: false}
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
prometheus:
  service: {type: ClusterIP}
  ingress: {enabled: false}
  prometheusSpec:
    retention: 2h
    retentionSize: 512MB
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    additionalScrapeConfigs:
      - job_name: robot-shop-availability
        metrics_path: /probe
        params: {module: [http_success]}
        static_configs:
          - targets: ['http://web.robot-shop.svc.cluster.local:8080/api/catalogue/products']
        relabel_configs:
          - {source_labels: [__address__], target_label: __param_target}
          - {source_labels: [__param_target], target_label: instance}
          - {target_label: __address__, replacement: 'blackbox.observability.svc.cluster.local:9115'}
      - job_name: robot-shop-cart
        static_configs: [{targets: ['cart.robot-shop.svc.cluster.local:8080']}]
grafana:
  service: {type: ClusterIP}
  ingress: {enabled: false}
  admin:
    existingSecret: capstone2-grafana
    userKey: username
    passwordKey: password
  persistence: {enabled: false}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: observability
  additionalDataSources:
    - {name: Loki, uid: loki, type: loki, access: proxy, url: 'http://loki:3100'}
    - {name: Jaeger, uid: jaeger, type: jaeger, access: proxy, url: 'http://jaeger:16686'}
alertmanager:
  service: {type: ClusterIP}
  ingress: {enabled: false}
  alertmanagerSpec:
    secrets: [capstone2-slack]
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
  config:
    route:
      receiver: slack
      group_by: [alertname]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    receivers:
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/capstone2-slack/webhook
            channel: '#capstone-alerts'
            send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.runbook_url }} — service={{ .CommonLabels.service }}'
# Operator/node exporter/kube-state-metrics still need version/resource review.

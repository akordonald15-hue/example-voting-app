{{- if ne .Release.Namespace "observability" }}{{ fail "STOP: this chart may only target observability, never voting-app" }}{{ end }}
{{- range $name, $component := .Values.components }}
{{- $digest := required (printf "resolve/review %s digest before deployment" $name) $component.digest }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) }}{{ fail "invalid image digest" }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}}
spec:
  replicas: 1
  strategy: {{ if $.Values.localDemo }}{type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}{{ else }}{type: Recreate}{{ end }}
  selector: {matchLabels: {app: {{ $name }}}}
  template:
    metadata: {labels: {app: {{ $name }}, capstone2-component: auxiliary}}
    spec:
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{ toJson . }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations: {{ toJson . }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toJson . }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s@%s" $component.repository $digest | quote }}
          {{- if $.Values.localDemo }}
          imagePullPolicy: Never
          {{- end }}
          {{- with $component.args }}
          args: {{ toJson . }}
          {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: {{ $component.memory }}}
          ports:
            - {name: http, containerPort: {{ $component.port }}}
            {{- if eq $name "jaeger" }}
            - {name: otlp, containerPort: 4318}
            {{- end }}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: observability-config}}
        - {name: data, emptyDir: {sizeLimit: 1Gi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}}
spec:
  type: ClusterIP
  selector: {app: {{ $name }}}
  ports:
    - {name: http, port: {{ $component.port }}, targetPort: http}
    {{- if eq $name "jaeger" }}
    - {name: otlp, port: 4318, targetPort: otlp}
    {{- end }}
{{- end }}

receivers:
  otlp:
    protocols:
      http: {endpoint: '0.0.0.0:4318'}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 80
    spike_limit_mib: 16
  batch:
    send_batch_size: 128
    timeout: 5s
exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/jaeger]

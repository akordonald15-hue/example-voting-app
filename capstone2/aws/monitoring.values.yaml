fullnameOverride: capstone2-monitoring
defaultRules:
  create: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
prometheus:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  prometheusSpec:
    retention: 2h
    retentionSize: 512MB
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    additionalScrapeConfigs:
    - job_name: robot-shop-availability
      metrics_path: /probe
      params:
        module:
        - http_success
      static_configs:
      - targets:
        - http://web.robot-shop.svc.cluster.local:8080/api/catalogue/products
      relabel_configs:
      - source_labels:
        - __address__
        target_label: __param_target
      - source_labels:
        - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox.observability.svc.cluster.local:9115
    - job_name: robot-shop-cart
      static_configs:
      - targets:
        - cart.robot-shop.svc.cluster.local:8080
    - job_name: robot-shop-web
      static_configs:
      - targets:
        - web.robot-shop.svc.cluster.local:8080
    - job_name: robot-shop-catalogue
      static_configs:
      - targets:
        - catalogue.robot-shop.svc.cluster.local:8080
    - job_name: robot-shop-payment
      static_configs:
      - targets:
        - payment.robot-shop.svc.cluster.local:8080
    nodeSelector: &id001
      kubernetes.io/hostname: capstone2-worker
      capstone-workload: robot-shop
    tolerations: &id002
    - key: capstone-workload
      operator: Equal
      value: robot-shop
      effect: NoSchedule
    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: observability
    podMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: observability
    ruleNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: observability
    ruleSelector:
      matchLabels:
        release: monitoring
    storageSpec: {}
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.15.0-distroless
      sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
grafana:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  admin:
    existingSecret: capstone2-grafana
    userKey: username
    passwordKey: password
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: observability
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    datasources:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    image:
      registry: quay.io
      repository: kiwigrid/k8s-sidecar
      tag: 2.14.1
      sha: 092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
  additionalDataSources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
  defaultDashboardsEnabled: false
  startupProbe:
    httpGet:
      path: /api/health
      port: 3000
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    timeoutSeconds: 5
  nodeSelector: *id001
  tolerations: *id002
  testFramework:
    enabled: false
  rbac:
    namespaced: true
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 13.2.4-distroless
    sha: ae3d3add290adbe6a88412229f5d76fd7bb82743050881698642d3d62f277e35
alertmanager:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  alertmanagerSpec:
    secrets: []
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    nodeSelector: *id001
    tolerations: *id002
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.34.1
      sha: e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
  config:
    route:
      receiver: local-no-delivery
    receivers:
    - name: local-no-delivery
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    tag: v0.94.1
    sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
    pullPolicy: IfNotPresent
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
  nodeSelector: *id001
  tolerations: *id002
  admissionWebhooks:
    enabled: false
    patch:
      nodeSelector: *id001
      tolerations: *id002
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      image:
        registry: ghcr.io
        repository: jkroepke/kube-webhook-certgen
        tag: 1.11.0
        sha: 778d97dc3986355625e14392419b3364c487a7c807d4d86ddad1df369129b082
  tls:
    enabled: false
  namespaces:
    releaseNamespace: true
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-config-reloader
      tag: v0.94.1
      sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
  kubeletService:
    enabled: false
  kubeletEndpointsEnabled: false
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  enabled: false
prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  labels:
    service: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      service: shipping
  template:
    metadata:
      labels:
        service: shipping
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toJson . }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
      - name: shipping
        image: {{ include "robot.image" (dict "root" . "name" "shipping") }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          - {name: CART_ENDPOINT, value: "cart.{{ .Release.Namespace }}.svc.cluster.local.:8080"}
          - {name: DB_HOST, value: "mysql.{{ .Release.Namespace }}.svc.cluster.local."}
        ports:
        - containerPort: 8080
        # it's Java it needs lots of memory
        resources:
          limits:
            cpu: {{ .Values.shipping.cpuLimit | default (ternary "500m" "200m" (.Values.localDemo | default false)) }}
            memory: 1000Mi
          requests:
            cpu: 100m
            memory: 500Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
          successThreshold: 1
      restartPolicy: Always
      {{- with .Values.shipping.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shipping.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shipping.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

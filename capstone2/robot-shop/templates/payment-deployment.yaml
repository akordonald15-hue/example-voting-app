apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    service: payment
    stage: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      service: payment
      stage: prod
  template:
    metadata:
      labels:
        service: payment
        stage: prod
    spec:
      automountServiceAccountToken: false
      containers:
      - name: payment
        image: {{ include "robot.image" (dict "root" . "name" "payment") }}
        imagePullPolicy: {{ if .Values.localDemo }}Never{{ else }}{{ .Values.image.pullPolicy }}{{ end }}
        env:
          - {name: OTEL_SERVICE_NAME, value: payment}
          - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel.observability.svc.cluster.local:4318"}
          {{- if .Values.payment.gateway }}
          - name: PAYMENT_GATEWAY
            value: {{ .Values.payment.gateway }}
          {{- end }}
        ports:
        - containerPort: 8080
        readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 5, failureThreshold: 12}
        startupProbe: {tcpSocket: {port: 8080}, periodSeconds: 5, failureThreshold: 36}
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
      restartPolicy: Always
      {{- with .Values.payment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.payment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.payment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

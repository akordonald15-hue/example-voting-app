apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    service: web
spec:
  replicas: 1
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web
        image: {{ include "robot.image" (dict "root" . "name" "web") }}
        imagePullPolicy: {{ if .Values.localDemo }}Never{{ else }}{{ .Values.image.pullPolicy }}{{ end }}
        ports:
        - containerPort: 8080
        readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 5, failureThreshold: 12}
        startupProbe: {tcpSocket: {port: 8080}, periodSeconds: 5, failureThreshold: 36}
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
      restartPolicy: Always
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

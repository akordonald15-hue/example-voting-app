apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voting.fullname" . }}-isolate
  labels:
    {{- include "voting.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- range $target, $sources := dict "redis" (list "vote" "worker") "postgres" (list "worker" "result") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voting.fullname" $ }}-{{ $target }}
  labels:
    {{- include "voting.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "voting.selector" (dict "root" $ "component" $target) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Chart.Name }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: {{ toJson $sources }}
      ports:
        - protocol: TCP
          port: {{ if eq $target "redis" }}6379{{ else }}5432{{ end }}
{{- range $source := $sources }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voting.fullname" $ }}-{{ $source }}-to-{{ $target }}
  labels:
    {{- include "voting.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "voting.selector" (dict "root" $ "component" $source) | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "voting.selector" (dict "root" $ "component" $target) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ if eq $target "redis" }}6379{{ else }}5432{{ end }}
{{- end }}
{{- end }}

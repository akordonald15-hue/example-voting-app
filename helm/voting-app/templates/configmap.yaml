apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "voting.fullname" . }}-config
  labels:
    {{- include "voting.labels" . | nindent 4 }}
data:
  REDIS_HOST: {{ printf "%s-redis" (include "voting.fullname" .) | quote }}
  PGHOST: {{ printf "%s-postgres" (include "voting.fullname" .) | quote }}
  PGPORT: "5432"
  PGUSER: {{ .Values.database.user | quote }}
  PGDATABASE: {{ .Values.database.name | quote }}
  OPTION_A: {{ .Values.options.a | quote }}
  OPTION_B: {{ .Values.options.b | quote }}
